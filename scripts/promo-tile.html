<!doctype html>
<!-- The Chrome Web Store's small promo tile, 440 × 280: npm run screenshots -- --store renders it into
     docs/store/<version>/. Only Atrio's own icon, name and colors (the Tokyo Night theme), nothing of third
     parties. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atrio promo tile</title>
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 84% 18%, rgb(122 162 247 / 0.62), transparent 42%),
          radial-gradient(circle at 10% 96%, rgb(187 154 247 / 0.5), transparent 46%),
          linear-gradient(160deg, #141c33, #0b1121 58%, #090e1b);
        color: #edf2ff;
        font-family:
          Inter,
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }
      .card {
        display: grid;
        gap: 22px;
        width: 336px;
        padding: 26px 28px 28px;
        border: 1px solid rgb(237 242 255 / 0.16);
        border-radius: 24px;
        background: linear-gradient(160deg, rgb(255 255 255 / 0.07), transparent 40%), rgb(13 18 31 / 0.5);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.1),
          0 18px 40px rgb(3 6 16 / 0.45);
        backdrop-filter: blur(18px) saturate(1.6);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .brand img {
        width: 74px;
        height: 74px;
      }
      h1 {
        margin: 0;
        font-size: 46px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      p {
        margin: 7px 0 0;
        color: #c3cde6;
        font-size: 16px;
      }
      /* The search box of the new tab, in outline. */
      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 38px;
        padding: 0 5px 0 13px;
        border: 1px solid rgb(192 207 240 / 0.22);
        border-radius: 13px;
        background: rgb(11 17 33 / 0.55);
      }
      .lens {
        width: 11px;
        height: 11px;
        border: 2px solid #8999b8;
        border-radius: 50%;
      }
      .line {
        flex: 1;
        height: 7px;
        border-radius: 4px;
        background: linear-gradient(90deg, rgb(137 153 184 / 0.55), rgb(137 153 184 / 0.12) 70%, transparent);
      }
      .go {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: #7aa2f7;
        color: #0b1121;
        font-size: 17px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img src="../assets/icons/icon.svg" alt="" />
        <div>
          <h1>Atrio</h1>
          <p>The new tab for developers</p>
        </div>
      </div>
      <div class="search" aria-hidden="true">
        <span class="lens"></span><span class="line"></span><span class="go">→</span>
      </div>
    </div>
  </body>
</html>
